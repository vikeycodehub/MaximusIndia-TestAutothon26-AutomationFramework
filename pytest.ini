[pytest]
addopts =
    -ra
    --strict-markers
    --self-contained-html
    --reruns=1
    --reruns-delay=2
testpaths = framework/tests
markers =
    smoke: quick sanity checks, must pass in every run
    regression: full regression coverage
    critical: business-critical flows, run first
    web: web UI automation tests
    mobile_web: mobile web / responsive emulation tests
    android: real/emulated Android device tests via Playwright Android (adb)
    appium: native Android app automation via Appium (UiAutomator2)
    api: API-level checks
log_cli = true
log_cli_level = INFO
